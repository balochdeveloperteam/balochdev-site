# Production: deploy the Cloudflare Workers API on every push to main.
#
# Plain-text dashboard Variables are preserved via `keep_vars = true` in
# worker/wrangler.toml (Wrangler otherwise deletes vars not listed in [vars]).
# Encrypted Secrets must still be set once in the Cloudflare dashboard
# (or `wrangler secret put`) — deploy never deletes Secrets.

name: Deploy Worker (API)

on:
  push:
    branches:
      - main
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

concurrency:
  group: cf-worker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        shell: bash
        working-directory: worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          # --keep-vars: do not wipe dashboard plain-text Variables on deploy
          command: deploy --keep-vars
